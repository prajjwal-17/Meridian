
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: meridian-storage
    command:
      - server
      - -s3
      - -dir=/data
      - -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: meridian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  seaweedfs_data:
    name: meridian-data

  postgres_data:
    name: meridian-postgres-data
