
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: meridian-storage
    command:
      - server
      - -s3
      - -dir=/data
      - -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

volumes:
  seaweedfs_data:
    name: meridian-data
